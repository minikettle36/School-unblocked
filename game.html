<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Game - Unblocked</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #000;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: white;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.9rem 1.25rem;
        background: rgba(0,0,0,0.85);
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      .back-link,
      .open-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.7rem 1rem;
        border-radius: 10px;
        text-decoration: none;
        background: #2563eb;
        color: white;
        font-weight: 700;
      }
      .game-shell {
        flex: 1;
        min-height: 0;
        position: relative;
        background: #000;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
      .fallback {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        text-align: center;
        padding: 2rem;
        background: #0b1020;
      }
      .fallback.visible {
        display: grid;
      }
      .fallback-box {
        max-width: 480px;
        background: rgba(15,23,42,0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 2rem;
      }
      .fallback p {
        margin: 0 0 1rem;
        color: #dfeafc;
        line-height: 1.6;
      }
      @media (max-width: 640px) {
        .topbar { padding: 0.7rem 0.9rem; }
        h1 { font-size: 1rem; }
        .back-link, .open-link { padding: 0.55rem 0.8rem; font-size: 0.8rem; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1 id="game-title">Loading...</h1>
      <a href="index.html" class="back-link">← Back to Games</a>
    </header>

    <main class="game-shell">
      <iframe id="game-frame" title="Game"></iframe>
      <div id="fallback" class="fallback" aria-live="polite">
        <div class="fallback-box">
          <p>This game block is not loading in the frame, so it was opened in a new tab instead.</p>
          <a id="fallback-link" class="open-link" href="#" target="_blank" rel="noopener noreferrer">Open game</a>
        </div>
      </div>
    </main>

    <script>
      const gameMap = {
        'drive-mad': { title: '🏎️ Drive Mad', url: 'https://anonymousbirb5100.github.io/drive-mad/' },
        'moto-x3m-2': { title: '🏍️ Moto X3M 2', url: 'https://www.crazygames.com/game/moto-x3m-2' },
        'flappy-bird': { title: '🐦 Flappy Bird', url: 'https://flappybird.io/' },
        '2048': { title: '🎯 2048', url: 'https://2048.io/' },
        'snake': { title: '🐍 Snake', url: 'https://playsnake.org/' },
        'tetris': { title: '🧩 Tetris', url: 'https://tetris.com/play-tetris' },
        'cookie-clicker': { title: '🍪 Cookie Clicker', url: 'https://orteil.dashnet.org/cookieclicker/' },
        'dino-run': { title: '🦖 Dino Run', url: 'https://chromedino.com/' }
      };

      const params = new URLSearchParams(window.location.search);
      const game = params.get('game');
      const entry = gameMap[game];
      const frame = document.getElementById('game-frame');
      const title = document.getElementById('game-title');
      const fallback = document.getElementById('fallback');
      const fallbackLink = document.getElementById('fallback-link');

      if (!entry) {
        window.location.href = 'index.html';
      } else {
        title.textContent = entry.title;
        fallbackLink.href = entry.url;
        frame.src = entry.url;

        setTimeout(() => {
          const isBlocked = !frame.contentWindow || !frame.contentWindow.document || !frame.contentWindow.document.body;
          if (isBlocked) {
            fallback.classList.add('visible');
            window.open(entry.url, '_blank', 'noopener,noreferrer');
          }
        }, 2500);
      }
    </script>
  </body>
</html>
