<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Unblocked</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #121826;
        --panel: rgba(17, 24, 39, 0.8);
        --accent: #5eead4;
        --accent-strong: #14b8a6;
        --text: #e5edf8;
        --muted: #b7c3d9;
      }

      html, body {
        width: 100%;
        height: 100%;
      }

      body {
        font-family: Inter, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--text);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.9rem 1.25rem;
        background: rgba(15, 23, 42, 0.95);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        min-width: 0;
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.1rem;
        height: 2.1rem;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        border-radius: 10px;
        font-size: 1.1rem;
        box-shadow: 0 8px 20px rgba(20, 184, 166, 0.35);
      }

      h1 {
        font-size: clamp(1rem, 2vw, 1.45rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .open-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.7rem 1rem;
        border-radius: 10px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        text-decoration: none;
        font-size: 0.87rem;
        font-weight: 600;
        transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.28);
        white-space: nowrap;
      }

      .open-link:hover {
        transform: translateY(-1px);
        opacity: 0.98;
      }

      .game-shell {
        flex: 1;
        min-height: 0;
        background: rgba(15, 23, 42, 0.35);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }

      @media (max-width: 640px) {
        .topbar {
          padding: 0.75rem 0.9rem;
        }

        .open-link {
          padding: 0.6rem 0.8rem;
          font-size: 0.78rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <span class="brand-badge">🎮</span>
        <h1>School Unblocked</h1>
      </div>

      <a
        class="open-link"
        href="https://anonymousbirb5100.github.io/drive-mad/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Game in New Tab
      </a>
    </header>

    <main class="game-shell">
      <iframe
        src="https://anonymousbirb5100.github.io/drive-mad/"
        title="Drive Mad"
        loading="lazy"
        allowfullscreen
      ></iframe>
    </main>
  </body>
</html>
