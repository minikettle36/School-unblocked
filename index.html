<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Unblocked - Games Hub</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #121826;
        --panel: rgba(17, 24, 39, 0.8);
        --accent: #5eead4;
        --accent-strong: #14b8a6;
        --text: #e5edf8;
        --muted: #b7c3d9;
      }

      html, body {
        width: 100%;
        height: 100%;
      }

      body {
        font-family: Inter, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.5rem;
        background: rgba(15, 23, 42, 0.95);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.5rem;
        height: 2.5rem;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        border-radius: 12px;
        font-size: 1.3rem;
        box-shadow: 0 8px 20px rgba(20, 184, 166, 0.35);
      }

      h1 {
        font-size: clamp(1.1rem, 2vw, 1.6rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .container {
        flex: 1;
        padding: 2rem 1.5rem;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }

      .intro {
        text-align: center;
        margin-bottom: 3rem;
      }

      .intro h2 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, var(--accent), #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .intro p {
        font-size: 1.05rem;
        color: var(--muted);
      }

      .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
        margin-bottom: 3rem;
      }

      .game-card {
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 1.5rem;
        text-decoration: none;
        color: var(--text);
        transition: all 0.25s ease;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .game-card:hover {
        background: rgba(17, 24, 39, 1);
        border-color: var(--accent);
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(94, 234, 212, 0.15);
      }

      .game-icon {
        font-size: 3rem;
        text-align: center;
      }

      .game-name {
        font-size: 1.3rem;
        font-weight: 700;
      }

      .game-desc {
        font-size: 0.95rem;
        color: var(--muted);
        flex-grow: 1;
      }

      .game-btn {
        display: inline-block;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        text-align: center;
        transition: all 0.2s ease;
        border: none;
        cursor: pointer;
      }

      .game-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
      }

      @media (max-width: 640px) {
        .topbar {
          padding: 0.75rem 1rem;
        }

        .container {
          padding: 1.5rem 1rem;
        }

        .intro h2 {
          font-size: 1.5rem;
        }

        .games-grid {
          grid-template-columns: 1fr;
          gap: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <span class="brand-badge">🎮</span>
        <h1>School Unblocked</h1>
      </div>
    </header>

    <div class="container">
      <div class="intro">
        <h2>Play Games Unblocked</h2>
        <p>Access your favorite games anytime, anywhere</p>
      </div>

      <div class="games-grid">
        <a href="drive-mad.html" class="game-card">
          <div class="game-icon">🏎️</div>
          <div class="game-name">Drive Mad</div>
          <div class="game-desc">Race through challenging tracks and pull off insane stunts</div>
          <button class="game-btn">Play Now</button>
        </a>

        <a href="moto-x3m-2.html" class="game-card">
          <div class="game-icon">🏍️</div>
          <div class="game-name">Moto X3M 2</div>
          <div class="game-desc">Extreme motorbike racing with dangerous obstacles and jumps</div>
          <button class="game-btn">Play Now</button>
        </a>
      </div>
    </div>
  </body>
</html>
