<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moto X3M 2 - School Unblocked</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
      }

      body {
        font-family: Inter, "Segoe UI", sans-serif;
        background: #000;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.9rem 1.25rem;
        background: rgba(0, 0, 0, 0.85);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }

      h1 {
        font-size: 1.3rem;
        color: #fff;
        font-weight: 700;
      }

      .back-link {
        padding: 0.6rem 1rem;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      .back-link:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
      }

      .game-shell {
        flex: 1;
        min-height: 0;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }

      @media (max-width: 640px) {
        .topbar {
          padding: 0.7rem 0.9rem;
        }

        h1 {
          font-size: 1.1rem;
        }

        .back-link {
          padding: 0.5rem 0.8rem;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <h1>🏍️ Moto X3M 2</h1>
      </div>
      <a href="index.html" class="back-link">← Back to Games</a>
    </header>

    <main class="game-shell">
      <iframe
        src="https://github.com/repos"
        title="GitHub Repos"
        allowfullscreen
      ></iframe>
    </main>
  </body>
</html>
